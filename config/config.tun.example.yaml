# Sanitized TUN example only.
# Do not commit a real subscription URL.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

tun:
  enable: true
  stack: gvisor
  auto-route: true
  strict-route: true
  dns-hijack:
    - any:53

dns:
  enable: true
  enhanced-mode: fake-ip
  listen: 0.0.0.0:1053

proxy-providers:
  subscription:
    type: http
    url: "YOUR_SUBSCRIPTION_URL_HERE"
    interval: 900
    path: ./providers/subscription.yaml
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

proxies:
  - name: DIRECT
    type: direct

proxy-groups:
  - name: AUTO
    type: select
    use:
      - subscription
    proxies:
      - DIRECT

rules:
  - MATCH,AUTO
